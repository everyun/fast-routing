[package]
name = "fr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "fr-cli"
description = "Command-line interface for the freerouting Rust port."

[dependencies]
fr-io = { path = "../fr-io" }
fr-core = { path = "../fr-core" }
# `--settle-trace` writes through the same sink the router's expansion loop uses.
fr-metrics = { path = "../fr-metrics" }

[[bin]]
name = "fr-cli"
path = "src/main.rs"
