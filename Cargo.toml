[workspace]
resolver = "2"
members = [
    "crates/fr-datastructures",
    "crates/fr-geometry",
    "crates/fr-board",
    "crates/fr-rules",
    "crates/fr-io",
    # `fr-autoroute` and `fr-drc` are the pre-rewrite router and checker. They are superseded
    # by M2 and by `fr-check` respectively, are optional dependencies of `fr-core` behind its
    # default-on `legacy` feature, and reach the build only through `fr_core::legacy`. They
    # stay members because a path dependency of a member is a member either way; the real
    # removal is deleting the directories, which M2 does.
    "crates/fr-autoroute",
    "crates/fr-drc",
    "crates/fr-check",
    "crates/fr-metrics",
    "crates/fr-core",
    "crates/fr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"
repository = "https://github.com/freerouting/freerouting"

[workspace.dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rayon = "1.10"
# CUDA acceleration is optional and only linked on hosts with a CUDA toolchain.
# cudarc = { version = "0.13", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
