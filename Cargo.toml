[workspace]
resolver = "2"
members = [
    "crates/fr-datastructures",
    "crates/fr-geometry",
    "crates/fr-board",
    "crates/fr-rules",
    "crates/fr-io",
    "crates/fr-check",
    "crates/fr-metrics",
    "crates/fr-router",
    "crates/fr-core",
    "crates/fr-cli",
    # The G2.1 referee (`bench/README.md`, "Judging a session"). Bench tooling rather than
    # product, but it is what the quality gate is measured with, so it is a workspace member and
    # `cargo clippy --workspace` covers it. It may never depend on `fr-router`: the referee has
    # to judge a session file without knowing who wrote it.
    "bench/tools/g21_referee",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"
repository = "https://github.com/freerouting/freerouting"

[workspace.dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rayon = "1.10"
smallvec = { version = "1.15", features = ["const_new"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
